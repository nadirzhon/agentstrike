[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentstrike"
version = "1.0.0"
description = "Authorized red-team fuzzer for LLM agents — a mutatable prompt-injection battery with canary-proven breaches. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nadirzhon" }]
keywords = ["security", "llm", "prompt-injection", "red-team", "ai-security", "owasp-llm", "mcp"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentstrike = "agentstrike.cli:main"

[project.urls]
Homepage = "https://github.com/nadirzhon/agentstrike"

[tool.setuptools.packages.find]
include = ["agentstrike*"]
